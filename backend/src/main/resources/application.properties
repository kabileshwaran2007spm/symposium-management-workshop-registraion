spring.application.name=campusconnect
server.port=${PORT:${SERVER_PORT:8080}}

# ---------------------------------------------------------------
# MongoDB
# Spring Boot 4 renamed this namespace: the connection URI now lives at
# spring.mongodb.uri (it was spring.data.mongodb.uri in Boot 3). Getting this
# wrong is silent - the driver falls back to its own default of
# mongodb://localhost/test and the app writes to a database nobody asked for.
#
# The URI is supplied through the environment so credentials are never
# committed. A local, credential-free instance is the documented dev default.
# ---------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/campusconnect}

# ---------------------------------------------------------------
# JWT
# No default is provided. JwtService fails fast at startup when the
# secret is missing or too short for HS256.
# ---------------------------------------------------------------
# The issuer is URL-shaped because RFC 7519 defines "iss" as a StringOrURI
# and the JOSE library exposes it as a URL.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=https://campusconnect.edu
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:1440}

# ---------------------------------------------------------------
# CORS - restricted to the frontend origin, not "*"
# ---------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://symposium-management-workshop-registraion-lol3-94n7acls4.vercel.app}

# ---------------------------------------------------------------
# Development seed data (admin + organizer accounts, sample clubs).
# Disabled automatically unless explicitly enabled.
# ---------------------------------------------------------------
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.password=${APP_SEED_PASSWORD:}

# ---------------------------------------------------------------
# JSON
# Spring Boot 4 runs on Jackson 3, which serialises java.time values as
# ISO-8601 strings and includes nulls by default. That is exactly the
# contract the frontend expects (dates like "2026-10-12", and "data": null
# on error responses), so no overrides are needed.
# Index creation is done explicitly in MongoIndexConfig.
# ---------------------------------------------------------------
spring.data.mongodb.auto-index-creation=false

# ---------------------------------------------------------------
# Paging guard: a hand-crafted size cannot ask for the whole table.
# ---------------------------------------------------------------
spring.data.web.pageable.max-page-size=100
