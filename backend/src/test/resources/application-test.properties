# Test profile.
#
# Uses a separate database so a test run can never touch development data, and
# supplies a JWT secret because JwtService deliberately fails fast when none is
# configured. This value is a throwaway that only ever signs tokens inside the
# test suite.
spring.mongodb.uri=mongodb://127.0.0.1:27017/campusconnect_test

app.jwt.secret=campusconnect-test-only-secret-value-1234567890
app.jwt.issuer=https://campusconnect.edu
app.jwt.expiry-minutes=60

app.seed.enabled=false

logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.mongodb.driver=WARN
